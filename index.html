<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フォトメモ</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --display-bg: #f8fafc;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      
      --primary-btn: #4ea8de;
      --accent-btn: #48bb78;
      --special-btn: #ed8936;
      --danger-btn: #f56565;
      
      --border-color: #e2e8f0;
      --selected-border: #4ea8de;
      --selected-bg: #ebf8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #cbd5e0;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 360px;
      height: 700px;
      background-color: var(--card-bg);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    /* 上部：写真エリア */
    .photo-section {
      flex: 4.5;
      background-color: var(--display-bg);
      border-radius: 20px;
      border: 2px dashed #cbd5e0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .photo-container {
      flex: 1;
      display: flex;
      gap: 8px;
      padding: 8px;
      overflow-x: auto;
      align-items: center;
      scroll-behavior: smooth;
    }

    .photo-wrapper {
      position: relative;
      height: 100%;
      flex-shrink: 0;
    }

    .photo-wrapper img {
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn-remove-photo {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(245, 101, 101, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    /* 中央：メモ入力エリア */
    .memo-section {
      flex: 3.5;
      display: flex;
      flex-direction: column;
    }

    .memo-input {
      width: 100%;
      height: 100%;
      background-color: var(--display-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .memo-input::placeholder {
      color: #a0aec0;
    }

    /* 下部：操作ボタンエリア */
    .action-section {
      flex: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }

    .btn.camera { background-color: var(--primary-btn); }
    .btn.save { background-color: var(--accent-btn); }
    .btn.etsuran { background-color: var(--special-btn); }

    /* capture属性を削除し、選択ダイアログをスマホ標準に任せる */
    #camera-input { display: none; }

    /* 閲覧モーダル */
    .modal-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--card-bg);
      z-index: 10;
      display: none;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    .modal-panel.active { display: flex; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .btn-close {
      background: #edf2f7;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .memo-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .memo-card {
      background-color: var(--display-bg);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .memo-card.selected {
      border-color: var(--selected-border);
      background-color: var(--selected-bg);
    }

    .memo-card.selected::before {
      content: "✓ 選択中";
      position: absolute;
      right: 12px;
      top: 10px;
      color: var(--primary-btn);
      font-weight: bold;
      font-size: 11px;
    }

    .memo-card-date {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .memo-card-photos {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .memo-card-photos img {
      height: 60px;
      width: 60px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .memo-card-text {
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-primary);
    }

    .btn-delete-selected {
      background-color: var(--danger-btn);
      color: #fff;
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .no-data {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 40px;
    }

    /* 写真拡大表示モーダル */
    .image-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .image-modal.active { display: flex; }

    .image-modal img {
      max-width: 100%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .btn-close-image {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 上部：写真エリア -->
  <div class="photo-section">
    <div class="photo-placeholder" id="photo-placeholder">📷 写真を撮影・追加</div>
    <div class="photo-container" id="photo-container" style="display: none;"></div>
  </div>

  <!-- 中央：メモ入力エリア -->
  <div class="memo-section">
    <textarea class="memo-input" id="memo-input" placeholder="メモを入力..."></textarea>
  </div>

  <!-- 下部：操作ボタンエリア -->
  <div class="action-section">
    <button class="btn camera" onclick="triggerCamera()">撮影 / 追加</button>
    <button class="btn save" onclick="saveData()">保存</button>
    <button class="btn etsuran" onclick="openEtsuran()">閲覧</button>
  </div>

  <!-- スマホの標準ダイアログを起動させるinput（capture削除） -->
  <input type="file" id="camera-input" accept="image/*" onchange="handlePhotoSelect(event)">

  <!-- 閲覧モーダル -->
  <div class="modal-panel" id="modal-panel">
    <div class="modal-header">
      <span class="modal-title">保存一覧</span>
      <button class="btn-close" onclick="closeEtsuran()">✕ 閉じる</button>
    </div>
    <div class="memo-list" id="memo-list"></div>
    
    <button class="btn-delete-selected" onclick="deleteSelectedData()">削除</button>
  </div>

  <!-- 写真拡大表示モーダル -->
  <div class="image-modal" id="image-modal" onclick="closeImageModal()">
    <button class="btn-close-image" onclick="closeImageModal()">✕</button>
    <img id="enlarged-image" src="" alt="拡大写真" onclick="event.stopPropagation()">
  </div>
</div>

<script>
  let currentPhotos = [];
  let savedDataList = JSON.parse(localStorage.getItem('photoMemos')) || [];
  let selectedIndexes = new Set();

  const cameraInput = document.getElementById('camera-input');
  const photoContainer = document.getElementById('photo-container');
  const photoPlaceholder = document.getElementById('photo-placeholder');
  const memoInput = document.getElementById('memo-input');

  function triggerCamera() {
    cameraInput.click();
  }

  // スマホ向け画像自動リサイズ＆圧縮処理
  function handlePhotoSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // スマホのメモリ・保存サイズに合わせて長辺最大1000pxに自動縮小
        const maxDimension = 1000;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // JPEG 70%品質に軽量化
        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
        currentPhotos.push(compressedBase64);
        renderTopPhotoPreview();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    cameraInput.value = "";
  }

  function removePhoto(index) {
    currentPhotos.splice(index, 1);
    renderTopPhotoPreview();
  }

  function renderTopPhotoPreview() {
    if (currentPhotos.length === 0) {
      photoContainer.style.display = 'none';
      photoPlaceholder.style.display = 'flex';
      return;
    }

    photoPlaceholder.style.display = 'none';
    photoContainer.style.display = 'flex';
    photoContainer.innerHTML = '';

    currentPhotos.forEach((photo, idx) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'photo-wrapper';
      wrapper.innerHTML = `
        <img src="${photo}" alt="写真">
        <button class="btn-remove-photo" onclick="removePhoto(${idx})">✕</button>
      `;
      photoContainer.appendChild(wrapper);
    });

    setTimeout(() => {
      photoContainer.scrollTo({
        left: photoContainer.scrollWidth,
        behavior: 'smooth'
      });
    }, 50);
  }

  function clearAllInput() {
    currentPhotos = [];
    renderTopPhotoPreview();
    memoInput.value = "";
  }

  function getCurrentFormattedDate() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    return `${y}.${m}.${d} ${hh}:${mm}`;
  }

  function saveData() {
    const memoText = memoInput.value.trim();

    if (!memoText && currentPhotos.length === 0) {
      alert("写真またはメモを入力してください。");
      return;
    }

    const newData = {
      id: Date.now(),
      date: getCurrentFormattedDate(),
      photos: [...currentPhotos],
      memo: memoText
    };

    try {
      savedDataList.unshift(newData);
      localStorage.setItem('photoMemos', JSON.stringify(savedDataList));
      alert("保存しました。");
      clearAllInput();
    } catch (e) {
      // 容量上限に達した場合のフォールバック
      alert("保存容量の上限に達しました。不要なメモを削除してから再度保存してください。");
    }
  }

  function openEtsuran() {
    selectedIndexes.clear();
    renderList();
    document.getElementById('modal-panel').classList.add('active');
  }

  function closeEtsuran() {
    document.getElementById('modal-panel').classList.remove('active');
  }

  function renderList() {
    const listContainer = document.getElementById('memo-list');
    if (savedDataList.length === 0) {
      listContainer.innerHTML = '<div class="no-data">保存されたデータはありません</div>';
      return;
    }

    listContainer.innerHTML = '';
    savedDataList.forEach((item, index) => {
      const card = document.createElement('div');
      const isSelected = selectedIndexes.has(index);
      card.className = 'memo-card' + (isSelected ? ' selected' : '');
      
      card.onclick = (e) => {
        if (e.target.tagName !== 'IMG') {
          toggleSelect(index);
        }
      };

      let photosHtml = '';
      if (item.photos && item.photos.length > 0) {
        photosHtml = `<div class="memo-card-photos">` + 
          item.photos.map(p => `<img src="${p}" alt="写真" onclick="showImageModal(event, '${p}')">`).join('') + 
          `</div>`;
      }

      card.innerHTML = `
        <div class="memo-card-date">${item.date}</div>
        ${photosHtml}
        <div class="memo-card-text">${item.memo || '(メモなし)'}</div>
      `;
      listContainer.appendChild(card);
    });
  }

  function toggleSelect(index) {
    if (selectedIndexes.has(index)) {
      selectedIndexes.delete(index);
    } else {
      selectedIndexes.add(index);
    }
    renderList();
  }

  function showImageModal(event, photoSrc) {
    event.stopPropagation();
    const modal = document.getElementById('image-modal');
    const img = document.getElementById('enlarged-image');
    img.src = photoSrc;
    modal.classList.add('active');
  }

  function closeImageModal() {
    const modal = document.getElementById('image-modal');
    modal.classList.remove('active');
  }

  function deleteSelectedData() {
    if (savedDataList.length === 0) {
      alert("削除するデータがありません。");
      return;
    }

    if (selectedIndexes.size > 0 && selectedIndexes.size < savedDataList.length) {
      const ok = confirm("選択情報削除OK？\nOK→削除 NO→キャンセル");
      if (ok) {
        savedDataList = savedDataList.filter((_, idx) => !selectedIndexes.has(idx));
        localStorage.setItem('photoMemos', JSON.stringify(savedDataList));
        selectedIndexes.clear();
        renderList();
      }
      return;
    }

    const ok = confirm("全部削除OK？\nOK→削除 NO→キャンセル");
    if (ok) {
      savedDataList = [];
      localStorage.removeItem('photoMemos');
      selectedIndexes.clear();
      renderList();
    }
  }
</script>
</body>
</html>
