<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フォトメモ</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- ピンチアウト拡大用ライブラリ (PinchZoom) -->
  <script src="https://cdn.jsdelivr.net/npm/pinch-zoom-js@2.3.5/dist/pinch-zoom.min.js"></script>

  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --display-bg: #f8fafc;
      --text-primary: #2d3748;
      --text-secondary: #718096;
      
      --primary-btn: #4ea8de;
      --secondary-btn: #4299e1;
      --accent-btn: #48bb78;
      --special-btn: #ed8936;
      --danger-btn: #f56565;
      --audio-btn: #9f7aea;
      --location-btn: #38b2ac;
      
      --border-color: #e2e8f0;
      --selected-border: #4ea8de;
      --selected-bg: #ebf8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #cbd5e0;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 360px;
      height: 720px;
      background-color: var(--card-bg);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    /* 上部：写真エリア */
    .photo-section {
      flex: 3.8;
      background-color: var(--display-bg);
      border-radius: 20px;
      border: 2px dashed #cbd5e0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .photo-container {
      flex: 1;
      display: flex;
      gap: 8px;
      padding: 8px;
      overflow-x: auto;
      align-items: center;
      scroll-behavior: smooth;
    }

    .photo-wrapper {
      position: relative;
      height: 100%;
      flex-shrink: 0;
    }

    .photo-wrapper img {
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn-remove-photo {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(245, 101, 101, 0.9);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    /* 中央：メモ入力エリア */
    .memo-section {
      flex: 3.2;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 録音・録画モード選択およびステータス表示 */
    .recording-status {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #e53e3e;
    }

    .recording-status.active {
      display: flex;
    }

    .mode-select-btns {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-sub-select {
      flex: 1;
      padding: 6px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
    }
    .btn-sub-select.audio-opt { background-color: var(--audio-btn); }
    .btn-sub-select.video-opt { background-color: #e53e3e; }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      background-color: #e53e3e;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .memo-input {
      width: 100%;
      height: 100%;
      background-color: var(--display-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .memo-input::placeholder {
      color: #a0aec0;
    }

    /* 下部：操作ボタンエリア */
    .action-section {
      flex: 3.0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex: 1;
    }

    .btn {
      border: none;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 3px 5px rgba(0,0,0,0.05);
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }

    .btn.camera { background-color: var(--primary-btn); }
    .btn.gallery { background-color: var(--secondary-btn); }
    .btn.audio { background-color: var(--audio-btn); }
    .btn.audio.active-mode { background-color: #e53e3e; animation: pulse 1.5s infinite; }
    .btn.location { background-color: var(--location-btn); }
    .btn.save { background-color: var(--accent-btn); }
    .btn.etsuran { background-color: var(--special-btn); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(229, 62, 62, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0); }
    }

    #camera-input, #gallery-input { display: none; }

    /* 閲覧モーダル */
    .modal-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--card-bg);
      z-index: 10;
      display: none;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
    }

    .modal-panel.active { display: flex; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .btn-close {
      background: #edf2f7;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .memo-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .memo-card {
      background-color: var(--display-bg);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .memo-card.selected {
      border-color: var(--selected-border);
      background-color: var(--selected-bg);
    }

    .memo-card.selected::before {
      content: "✓ 選択中";
      position: absolute;
      right: 12px;
      top: 10px;
      color: var(--primary-btn);
      font-weight: bold;
      font-size: 11px;
    }

    .memo-card-date {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .memo-card-photos {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .memo-card-photos img {
      height: 60px;
      width: 60px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .memo-card-text {
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-primary);
    }

    .memo-card-text a {
      color: #3182ce;
      text-decoration: underline;
    }

    /* 音声/動画再生用バッジ・プレイヤー */
    .media-player-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #edf2f7;
      border: 1px solid #cbd5e0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #4a5568;
      width: fit-content;
      margin-top: 4px;
      cursor: pointer;
    }

    .media-player-badge.playing {
      background: #e9d8fd;
      border-color: #b794f4;
      color: #553c9a;
    }

    .memo-card-video {
      width: 100%;
      max-height: 180px;
      border-radius: 12px;
      background: #000;
      margin-top: 4px;
    }

    .modal-footer-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-edit-selected {
      background-color: var(--secondary-btn);
      color: #fff;
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-delete-selected {
      background-color: var(--danger-btn);
      color: #fff;
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .no-data {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 40px;
    }

    /* 写真拡大表示モーダル（ピンチアウト領域） */
    .image-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-modal.active { display: flex; }

    .pinch-zoom-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-modal img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .btn-close-image {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 30;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 上部：写真エリア -->
  <div class="photo-section">
    <div class="photo-placeholder" id="photo-placeholder">📷 写真を撮影・選択</div>
    <div class="photo-container" id="photo-container" style="display: none;"></div>
  </div>

  <!-- 中央：メモ入力エリア -->
  <div class="memo-section">
    <!-- 録音・録画モード操作インジケーター -->
    <div class="recording-status" id="recording-status">
      <!-- ① 分岐ボタン表示エリア -->
      <div class="mode-select-btns" id="mode-select-btns">
        <button class="btn-sub-select audio-opt" onclick="startAudioRecording()">🎙 音声開始</button>
        <button class="btn-sub-select video-opt" onclick="startVideoRecording()">🎥 動画開始(最大10秒)</button>
      </div>

      <!-- ② 実行中ステータス表示エリア -->
      <div class="rec-indicator" id="rec-indicator" style="display: none;">
        <div class="rec-dot"></div>
        <span id="rec-status-text">処理中...</span>
        <span id="rec-timer">00:00</span>
      </div>
      <button id="btn-stop-rec" class="btn-close" style="display: none;" onclick="stopAudioRecording()">⏹ 停止</button>
    </div>

    <textarea class="memo-input" id="memo-input" placeholder="メモを入力..."></textarea>
  </div>

  <!-- 下部：操作ボタンエリア -->
  <div class="action-section">
    <div class="btn-row">
      <button class="btn camera" onclick="triggerCamera()">📷 撮影</button>
      <button class="btn gallery" onclick="triggerGallery()">🖼 アルバム</button>
    </div>
    <div class="btn-row">
      <!-- 改名：音声・動画ボタン -->
      <button class="btn audio" id="btn-audio-video" onclick="toggleAudioVideoMenu()">🎙/🎥 音声・動画</button>
      <button class="btn location" onclick="fetchLocation()">📍 現在地</button>
    </div>
    <div class="btn-row">
      <button class="btn save" onclick="saveData()">保存</button>
      <button class="btn etsuran" onclick="openEtsuran()">閲覧</button>
    </div>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handlePhotoSelect(event, true)">
  <input type="file" id="gallery-input" accept="image/*" onchange="handlePhotoSelect(event, false)">

  <!-- 閲覧モーダル -->
  <div class="modal-panel" id="modal-panel">
    <div class="modal-header">
      <span class="modal-title">保存一覧</span>
      <button class="btn-close" onclick="closeEtsuran()">✕ 閉じる</button>
    </div>
    <div class="memo-list" id="memo-list"></div>
    
    <div class="modal-footer-btns">
      <button class="btn-edit-selected" onclick="editSelectedData()">再編集</button>
      <button class="btn-delete-selected" onclick="deleteSelectedData()">削除</button>
    </div>
  </div>

  <!-- ピンチアウト対応 拡大表示モーダル -->
  <div class="image-modal" id="image-modal">
    <button class="btn-close-image" onclick="closeImageModal()">✕</button>
    <div class="pinch-zoom-container" id="pinch-zoom-container">
      <img id="enlarged-image" src="" alt="拡大写真">
    </div>
  </div>
</div>

<script>
  let currentPhotos = [];
  let currentAudioData = null;
  let currentVideoData = null; // 動画データ用
  let savedDataList = JSON.parse(localStorage.getItem('photoMemos')) || [];
  let selectedIndexes = new Set();
  let editingId = null;

  // 録音・録画用
  let mediaRecorder = null;
  let audioChunks = [];
  let videoChunks = [];
  let recordingInterval = null;
  let recordingSeconds = 0;
  let currentAudioInstance = null;
  let pinchZoomInstance = null;

  const cameraInput = document.getElementById('camera-input');
  const galleryInput = document.getElementById('gallery-input');
  const photoContainer = document.getElementById('photo-container');
  const photoPlaceholder = document.getElementById('photo-placeholder');
  const memoInput = document.getElementById('memo-input');

  function triggerCamera() { cameraInput.click(); }
  function triggerGallery() { galleryInput.click(); }

  // 写真選択＆圧縮
  function handlePhotoSelect(event, isCamera = false) {
    const file = event.target.files[0];
    if (!file) return;

    if (isCamera) {
      const downloadLink = document.createElement('a');
      downloadLink.href = URL.createObjectURL(file);
      downloadLink.download = `photo_${Date.now()}.jpg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const maxDimension = 1000;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
        currentPhotos.push(compressedBase64);
        renderTopPhotoPreview();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = "";
  }

  function removePhoto(index) {
    currentPhotos.splice(index, 1);
    renderTopPhotoPreview();
  }

  function renderTopPhotoPreview() {
    if (currentPhotos.length === 0) {
      photoContainer.style.display = 'none';
      photoPlaceholder.style.display = 'flex';
      return;
    }

    photoPlaceholder.style.display = 'none';
    photoContainer.style.display = 'flex';
    photoContainer.innerHTML = '';

    currentPhotos.forEach((photo, idx) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'photo-wrapper';
      wrapper.innerHTML = `
        <img src="${photo}" alt="写真">
        <button class="btn-remove-photo" onclick="removePhoto(${idx})">✕</button>
      `;
      photoContainer.appendChild(wrapper);
    });

    setTimeout(() => {
      photoContainer.scrollTo({ left: photoContainer.scrollWidth, behavior: 'smooth' });
    }, 50);
  }

  /* --- ２ 「音声・動画」モード機能 --- */
  function toggleAudioVideoMenu() {
    const recStatus = document.getElementById('recording-status');
    const modeSelect = document.getElementById('mode-select-btns');
    const recIndicator = document.getElementById('rec-indicator');
    const btnStop = document.getElementById('btn-stop-rec');

    if (recStatus.classList.contains('active')) {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        stopAudioRecording();
      } else {
        recStatus.classList.remove('active');
      }
    } else {
      recStatus.classList.add('active');
      modeSelect.style.display = 'flex';
      recIndicator.style.display = 'none';
      btnStop.style.display = 'none';
    }
  }

  // 音声録音開始
  async function startAudioRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        const reader = new FileReader();
        reader.onloadend = () => {
          currentAudioData = reader.result;
          memoInput.value += (memoInput.value ? "\n" : "") + "[🎙 音声データ添付あり]";
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(t => t.stop());
        resetRecUI();
      };

      mediaRecorder.start();
      showRecStatus("● 録音中...", false);
    } catch (err) {
      alert("マイクの使用許可が必要です。");
    }
  }

  // 動画撮影開始（10秒上限・超低解像度/高圧縮設定）
  async function startVideoRecording() {
    try {
      // 解像度を640x360相当に落としてストレージを大幅節約
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 360 }, frameRate: { max: 15 } },
        audio: true
      });

      videoChunks = [];
      // 低ビットレート（250kbps）で圧縮率を最大化
      const options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 250000 };
      
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) videoChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
        const reader = new FileReader();
        reader.onloadend = () => {
          currentVideoData = reader.result;
          memoInput.value += (memoInput.value ? "\n" : "") + "[🎥 動画データ添付あり]";
        };
        reader.readAsDataURL(videoBlob);
        stream.getTracks().forEach(t => t.stop());
        resetRecUI();
      };

      mediaRecorder.start();
      showRecStatus("🎥 動画撮影中...", true);
    } catch (err) {
      alert("カメラ・マイクの使用許可が必要です。");
    }
  }

  function showRecStatus(statusText, isVideo) {
    document.getElementById('mode-select-btns').style.display = 'none';
    document.getElementById('rec-indicator').style.display = 'flex';
    document.getElementById('btn-stop-rec').style.display = 'block';
    document.getElementById('rec-status-text').innerText = statusText;

    recordingSeconds = 0;
    document.getElementById('rec-timer').innerText = "00:00";
    
    recordingInterval = setInterval(() => {
      recordingSeconds++;
      const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
      const secs = String(recordingSeconds % 60).padStart(2, '0');
      document.getElementById('rec-timer').innerText = `${mins}:${secs}`;

      // 10秒自動停止ルール
      if (isVideo && recordingSeconds >= 10) {
        stopAudioRecording();
        alert("動画撮影は10秒上限に達したため自動終了しました。");
      }
    }, 1000);
  }

  function stopAudioRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      clearInterval(recordingInterval);
    }
  }

  function resetRecUI() {
    document.getElementById('recording-status').classList.remove('active');
    document.getElementById('btn-audio-video').classList.remove('active-mode');
  }

  // 現在地取得
  function fetchLocation() {
    if (!navigator.geolocation) {
      alert("お使いの端末は現在地取得に対応していません。");
      return;
    }

    memoInput.value += (memoInput.value ? "\n" : "") + "📍 現在地を取得中...";
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;
        memoInput.value = memoInput.value.replace("📍 現在地を取得中...", `📍 現在地: ${mapUrl}`);
      },
      () => {
        memoInput.value = memoInput.value.replace("📍 現在地を取得中...", "");
        alert("現在地の取得に失敗しました。GPS設定を確認してください。");
      }
    );
  }

  function clearAllInput() {
    currentPhotos = [];
    currentAudioData = null;
    currentVideoData = null;
    editingId = null;
    renderTopPhotoPreview();
    memoInput.value = "";
  }

  function getCurrentFormattedDate() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    return `${y}.${m}.${d} ${hh}:${mm}`;
  }

  function saveData() {
    const memoText = memoInput.value.trim();

    if (!memoText && currentPhotos.length === 0 && !currentAudioData && !currentVideoData) {
      alert("写真、音声、動画、またはメモを入力してください。");
      return;
    }

    if (editingId) {
      const index = savedDataList.findIndex(item => item.id === editingId);
      if (index !== -1) {
        savedDataList[index] = {
          ...savedDataList[index],
          photos: [...currentPhotos],
          memo: memoText,
          audio: currentAudioData !== null ? currentAudioData : savedDataList[index].audio,
          video: currentVideoData !== null ? currentVideoData : savedDataList[index].video
        };
      }
    } else {
      const newData = {
        id: Date.now(),
        date: getCurrentFormattedDate(),
        photos: [...currentPhotos],
        memo: memoText,
        audio: currentAudioData,
        video: currentVideoData
      };
      savedDataList.unshift(newData);
    }

    try {
      localStorage.setItem('photoMemos', JSON.stringify(savedDataList));
      alert(editingId ? "更新しました。" : "保存しました。");
      clearAllInput();
    } catch (e) {
      alert("保存容量の上限に達しました。不要なメモや動画を削除してから再度保存してください。");
    }
  }

  function openEtsuran() {
    selectedIndexes.clear();
    renderList();
    document.getElementById('modal-panel').classList.add('active');
  }

  function closeEtsuran() {
    if (currentAudioInstance) {
      currentAudioInstance.pause();
      currentAudioInstance = null;
    }
    document.getElementById('modal-panel').classList.remove('active');
  }

  function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, url => `<a href="${url}" target="_blank" onclick="event.stopPropagation()">${url}</a>`);
  }

  function renderList() {
    const listContainer = document.getElementById('memo-list');
    if (savedDataList.length === 0) {
      listContainer.innerHTML = '<div class="no-data">保存されたデータはありません</div>';
      return;
    }

    listContainer.innerHTML = '';
    savedDataList.forEach((item, index) => {
      const card = document.createElement('div');
      const isSelected = selectedIndexes.has(index);
      card.className = 'memo-card' + (isSelected ? ' selected' : '');
      
      card.onclick = (e) => {
        if (e.target.tagName !== 'IMG' && e.target.tagName !== 'A' && e.target.tagName !== 'VIDEO' && !e.target.classList.contains('media-player-badge')) {
          toggleSelect(index);
        }
      };

      let photosHtml = '';
      if (item.photos && item.photos.length > 0) {
        photosHtml = `<div class="memo-card-photos">` + 
          item.photos.map(p => `<img src="${p}" alt="写真" onclick="showImageModal(event, '${p}')">`).join('') + 
          `</div>`;
      }

      let audioHtml = '';
      if (item.audio) {
        audioHtml = `<div class="media-player-badge" id="audio-badge-${index}" onclick="playAudio(event, '${index}')">▶ 🎙 音声再生</div>`;
      }

      let videoHtml = '';
      if (item.video) {
        videoHtml = `<video class="memo-card-video" src="${item.video}" controls onclick="event.stopPropagation()"></video>`;
      }

      card.innerHTML = `
        <div class="memo-card-date">${item.date}</div>
        ${photosHtml}
        <div class="memo-card-text">${item.memo ? linkify(item.memo) : '(メモなし)'}</div>
        ${audioHtml}
        ${videoHtml}
      `;
      listContainer.appendChild(card);
    });
  }

  function playAudio(event, index) {
    event.stopPropagation();
    const item = savedDataList[index];
    const badge = document.getElementById(`audio-badge-${index}`);

    if (currentAudioInstance) {
      currentAudioInstance.pause();
      document.querySelectorAll('.media-player-badge').forEach(b => {
        b.classList.remove('playing');
        b.innerText = "▶ 🎙 音声再生";
      });
      if (currentAudioInstance.dataset.index === String(index)) {
        currentAudioInstance = null;
        return;
      }
    }

    const audio = new Audio(item.audio);
    audio.dataset.index = index;
    currentAudioInstance = audio;

    badge.classList.add('playing');
    badge.innerText = "⏹ 停止中...";

    audio.play();
    audio.onended = () => {
      badge.classList.remove('playing');
      badge.innerText = "▶ 🎙 音声再生";
      currentAudioInstance = null;
    };
  }

  function toggleSelect(index) {
    if (selectedIndexes.has(index)) {
      selectedIndexes.delete(index);
    } else {
      selectedIndexes.add(index);
    }
    renderList();
  }

  function editSelectedData() {
    if (selectedIndexes.size === 0) {
      alert("再編集する項目を1つ選択してください。");
      return;
    }
    if (selectedIndexes.size > 1) {
      alert("再編集できるのは1行（BOX）のみです。");
      return;
    }

    const selectedIdx = Array.from(selectedIndexes)[0];
    const targetData = savedDataList[selectedIdx];

    editingId = targetData.id;
    currentPhotos = targetData.photos ? [...targetData.photos] : [];
    currentAudioData = targetData.audio || null;
    currentVideoData = targetData.video || null;
    memoInput.value = targetData.memo || "";

    renderTopPhotoPreview();
    closeEtsuran();
  }

  /* --- １ ピンチアウト拡大表示機能 --- */
  function showImageModal(event, photoSrc) {
    event.stopPropagation();
    const modal = document.getElementById('image-modal');
    const img = document.getElementById('enlarged-image');
    img.src = photoSrc;
    modal.classList.add('active');

    // ライブラリの初期化 (PinchZoom)
    const el = document.getElementById('pinch-zoom-container');
    if (pinchZoomInstance) {
      pinchZoomInstance.destroy();
    }
    pinchZoomInstance = new PinchZoom(el, {
      draggableUnzoomed: false,
      minZoom: 1,
      maxZoom: 4
    });
  }

  function closeImageModal() {
    document.getElementById('image-modal').classList.remove('active');
  }

  function deleteSelectedData() {
    if (savedDataList.length === 0) {
      alert("削除するデータがありません。");
      return;
    }

    if (selectedIndexes.size > 0 && selectedIndexes.size < savedDataList.length) {
      const ok = confirm("選択情報削除OK？\nOK→削除 NO→キャンセル");
      if (ok) {
        savedDataList = savedDataList.filter((_, idx) => !selectedIndexes.has(idx));
        localStorage.setItem('photoMemos', JSON.stringify(savedDataList));
        selectedIndexes.clear();
        renderList();
      }
      return;
    }

    const ok = confirm("全部削除OK？\nOK→削除 NO→キャンセル");
    if (ok) {
      savedDataList = [];
      localStorage.removeItem('photoMemos');
      selectedIndexes.clear();
      renderList();
    }
  }
</script>
</body>
</html>
